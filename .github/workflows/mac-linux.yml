name: Run Linux Desktop in Browser

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  desktop:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
      - uses: actions/checkout@v4

      - name: Start KasmWeb Linux Desktop Container
        run: |
          docker run -d \
            --name=kasm-desktop \
            --security-opt seccomp=unconfined \
            -p 6901:6901 \
            -e VNC_PW=mypassword123 \
            --shm-size=512m \
            kasmweb/desktop:1.18.0

      - name: Expose via Cloudflare Tunnel (Free & Secure)
        run: |
          # Install cloudflared to create a temporary public URL for your desktop
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:6901 &
          
          # Keep the workflow alive for 30 minutes so you can use the desktop
          echo "Your desktop is running! Check the cloudflare URL above."
          sleep 1800
