name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: UniversalMediaDownloader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Ensure ffmpeg is in bin/
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          if (-not (Test-Path "bin/ffmpeg.exe")) {
            Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
            Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
            Copy-Item ffmpeg_tmp/*/bin/ffmpeg.exe bin/
            Copy-Item ffmpeg_tmp/*/bin/ffprobe.exe bin/
          }

      - name: Build EXE
        run: pyinstaller --clean --noconfirm universal_video_downloader.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal_video_downloader
          path: UniversalMediaDownloader/dist/universal_video_downloader.exe
