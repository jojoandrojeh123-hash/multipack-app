```yaml
name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

# Minimum permissions required by this build workflow
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: UniversalMediaDownloader

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Install Python
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # Download FFmpeg if missing
      - name: Ensure ffmpeg is in bin/
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null

          if (-not (Test-Path "bin/ffmpeg.exe")) {
            Invoke-WebRequest `
              -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" `
              -OutFile ffmpeg.zip

            Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp

            Copy-Item ffmpeg_tmp/*/bin/ffmpeg.exe bin/
            Copy-Item ffmpeg_tmp/*/bin/ffprobe.exe bin/
          }

      # Build executable
      - name: Build EXE
        run: pyinstaller --clean --noconfirm universal_video_downloader.spec

      # Upload executable
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: universal_video_downloader
          path: UniversalMediaDownloader/dist/universal_video_downloader.exe
```